name: CE R0 Full Boundary CI

on:
  push:
    branches:
      - "remediation/ce-r0-full-boundary-r1/2026-10-06"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        shell: bash
        run: python -m compileall -q src tests tools
      - name: Source identity
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -B tools/compute_source_identity_v2.py
      - name: Full unit suite
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
