name: CE Convergent A1 B1 Tests

on:
  push:
    branches:
      - "development/convergent-a1-b1/**"
  pull_request:
    branches:
      - "development/convergent-a1-b1/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3.13 --version
      - name: Compile source and tests
        run: python3.13 -m compileall -q src tests
      - name: Compute canonical source-tree identity
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3.13 tools/compute_source_identity_v2.py
      - name: Verify canonical source-tree identity
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3.13 tools/verify_source_identity.py
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3.13 -m unittest discover -s tests -p 'test_*.py' -v
