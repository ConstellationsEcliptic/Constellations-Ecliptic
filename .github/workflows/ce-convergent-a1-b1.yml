name: CE Convergent A1 B1 Tests

on:
  push:
    branches:
      - "development/convergent-a1-b1/**"
  pull_request:
    branches:
      - "development/convergent-a1-b1/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Python version
        run: python --version
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Compute canonical source-tree identity
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/compute_source_identity_v2.py
      - name: Verify canonical source-tree identity
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_source_identity.py
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
