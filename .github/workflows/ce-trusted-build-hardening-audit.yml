name: CE V1 Trusted Build Hardening Audit (ephemeral)

on:
  push:
    branches:
      - audit/trusted-build-hardening/2026-09-29-r1

permissions:
  contents: read

jobs:
  hardening-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up exact Python toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          architecture: 'x64'
          check-latest: false

      - name: Fetch exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git init audit-worktree
          cd audit-worktree
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          CANDIDATE_SHA="8e3ffd424dfe5d291e5183fa57ac65a293117a62"
          git fetch --no-tags origin "candidate/trusted-build-hardening/2026-09-29-r1"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git archive "$CANDIDATE_SHA" | tar -x
          printf 'CANDIDATE_SHA=%s\n' "$CANDIDATE_SHA"

      - name: Materialize canonical candidate source hash
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/audit-worktree"
          python build/check_build_inputs.py
          ACTUAL="$(python build/build_source_tree_hash.py)"
          MANIFEST="$(cut -d' ' -f1 manifests/SOURCE_TREE_SHA256_V2.txt)"
          test "$ACTUAL" = "$MANIFEST"
          printf 'SOURCE_TREE_SHA256=%s\n' "$ACTUAL"
          printf 'SOURCE_TREE_SHA256_STATUS=PASS\n'
          for n in tests build1 build2 pkg1 pkg2; do
            mkdir -p "$RUNNER_TEMP/ce-$n/repo"
            tar -cf - --exclude=.git . | tar -xf - -C "$RUNNER_TEMP/ce-$n/repo"
          done

      - name: Verify trusted build candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/audit-worktree"
          python build/verify_trusted_build_inputs.py

      - name: Run V1 tests under exact Python
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ce-tests/repo"
          python tools/run_tests.py

      - name: Fetch and verify pinned build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-downloads"
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/build-downloads" "pip==26.2.1" "setuptools==82.0.1"
          cd "$GITHUB_WORKSPACE/audit-worktree"
          python -m pip install --no-index --no-cache-dir --require-hashes --find-links "$RUNNER_TEMP/build-downloads" --target "$RUNNER_TEMP/locked-wheels" -r build/trusted-build-dependency-lock.txt
          printf 'PINNED_ARTIFACTS_VERIFIED=TRUE\n'
          sha256sum "$RUNNER_TEMP/build-downloads"/* | sort

      - name: Create isolated locked build environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/ce-venv"
          "$RUNNER_TEMP/ce-venv/bin/python" -m pip install --no-index --no-cache-dir --require-hashes --find-links "$RUNNER_TEMP/build-downloads" "pip==26.2.1" "setuptools==82.0.1"
          "$RUNNER_TEMP/ce-venv/bin/python" -m pip --version
          "$RUNNER_TEMP/ce-venv/bin/python" - <<'PY'
          import setuptools
          assert setuptools.__version__ == "82.0.1"
          print("SETUPTOOLS_VERSION=" + setuptools.__version__)
          PY

      - name: Build wheel twice with network disabled
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=0
          PY="$RUNNER_TEMP/ce-venv/bin/python"
          for n in 1 2; do
            cd "$RUNNER_TEMP/ce-build$n/repo"
            "$PY" -m pip wheel . --no-deps --no-build-isolation --no-index --find-links "$RUNNER_TEMP/build-downloads" --wheel-dir "$RUNNER_TEMP/wheel$n"
            test "$(find "$RUNNER_TEMP/wheel$n" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          done
          W1="$(sha256sum "$RUNNER_TEMP/wheel1"/*.whl | cut -d' ' -f1)"
          W2="$(sha256sum "$RUNNER_TEMP/wheel2"/*.whl | cut -d' ' -f1)"
          test "$W1" = "$W2"
          printf 'WHEEL_REPRODUCIBLE=TRUE\n'
          printf 'WHEEL_SHA256=%s\n' "$W1"

      - name: Build source package twice
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2; do
            cd "$RUNNER_TEMP/ce-pkg$n/repo"
            python tools/build_source_tree_hash.py >/dev/null
            python tools/package_source.py
            test -f "$RUNNER_TEMP/ce-pkg$n/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip"
          done
          P1="$(sha256sum "$RUNNER_TEMP/ce-pkg1/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" | cut -d' ' -f1)"
          P2="$(sha256sum "$RUNNER_TEMP/ce-pkg2/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" | cut -d' ' -f1)"
          test "$P1" = "$P2"
          printf 'SOURCE_PACKAGE_REPRODUCIBLE=TRUE\n'
          printf 'SOURCE_PACKAGE_SHA256=%s\n' "$P1"

      - name: Emit provenance record
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/audit-worktree"
          printf '%s\n' '--- CE_TRUSTED_BUILD_HARDENING_AUDIT_BEGIN ---'
          printf 'CANDIDATE_COMMIT=8e3ffd424dfe5d291e5183fa57ac65a293117a62\n'
          printf 'SOURCE_TREE_SHA256='; cut -d' ' -f1 manifests/SOURCE_TREE_SHA256_V2.txt
          printf 'PYTHON_VERSION='; python --version
          printf 'PIP_VERSION='; "$RUNNER_TEMP/ce-venv/bin/python" -m pip --version
          printf 'SETUPTOOLS_VERSION='; "$RUNNER_TEMP/ce-venv/bin/python" -c 'import setuptools; print(setuptools.__version__)'
          printf 'DEPENDENCY_LOCK_SHA256='; sha256sum build/trusted-build-dependency-lock.txt | cut -d' ' -f1
          printf 'TRUSTED_BUILD_LOCK_SHA256='; sha256sum build/trusted-build-lock.json | cut -d' ' -f1
          printf 'WHEEL_REPRODUCIBLE=TRUE\n'
          printf 'SOURCE_PACKAGE_REPRODUCIBLE=TRUE\n'
          printf 'NETWORK_DURING_BUILD=FALSE\n'
          printf 'FORMAL_TRUSTED_BUILD=NOT_ESTABLISHED\n'
          printf 'PRODUCTION_RUNTIME=NOT_AUTHORIZED\n'
          printf 'FAIL_CLOSED=TRUE\n'
          printf 'AUDIT_SCOPE=EPHEMERAL_EXTERNAL_TO_PR5\n'
          printf '%s\n' '--- CE_TRUSTED_BUILD_HARDENING_AUDIT_END ---'
