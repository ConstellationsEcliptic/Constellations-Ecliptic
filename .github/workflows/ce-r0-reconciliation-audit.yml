name: CE R0 Reconciliation Audit

on:
  push:
    branches:
      - "audit/ce-r0-reconciliation-r1/2026-10-06"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Compile source, tests and audit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q src tests tools
      - name: Compute exact candidate source identity
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          echo "CANDIDATE_SOURCE_TREE_SHA256_V2=$(python tools/compute_source_identity_v2.py)"
      - name: Verify exact candidate source identity
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_source_identity.py
      - name: Baseline candidate suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CE-R0 adversarial acceptance suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          python -m unittest tests.test_ce_r0_reconciliation_acceptance_r1 tests.test_ce_r0_source_identity_acceptance_r1 tests.test_ce_r0_additional_acceptance_r1 tests.test_ce_r0_native_authorization_acceptance_r1
