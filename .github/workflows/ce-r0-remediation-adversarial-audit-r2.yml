name: CE R0 Remediation Adversarial Audit R2

on:
  push:
    branches:
      - "audit/ce-r0-remediation-adversarial-r2/2026-10-06"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run adversarial tests
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m unittest             tests.test_ce_r0_remediation_adversarial_r2             tests.test_ce_r0_control_plane_identity_scope_r2             tests.test_ce_r0_output_type_strictness_r2 