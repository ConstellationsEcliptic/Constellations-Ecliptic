name: CE Pre-A10 Area Register Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - governance/candidates/CE_PRE_A10_AREA_REGISTER_R0_2026-10-09.json
      - governance/candidates/CE_PRE_A10_AREA_REGISTER_R1_2026-10-10.json
      - governance/candidates/CE_PRE_A10_AREA_REGISTER_R2_2026-10-10.json
      - governance/candidates/CE_PRE_A10_AREA_REGISTER_R3_2026-10-10.json
      - scripts/governance/**
      - .github/workflows/ce-pre-a10-review-register.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-area-register:
    name: Validate register structure (${{ matrix.register }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        register:
          - governance/candidates/CE_PRE_A10_AREA_REGISTER_R0_2026-10-09.json
          - governance/candidates/CE_PRE_A10_AREA_REGISTER_R1_2026-10-10.json
          - governance/candidates/CE_PRE_A10_AREA_REGISTER_R2_2026-10-10.json
          - governance/candidates/CE_PRE_A10_AREA_REGISTER_R3_2026-10-10.json
    steps:
      # Reviewed immutable action commit for actions/checkout v7.0.1.
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate review register integrity
        run: >-
          python3 scripts/governance/pre_a10_area_gate.py
          "${{ matrix.register }}"

  validator-unit-tests:
    name: Run validator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reviewed immutable action commit for actions/checkout v7.0.1.
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run validator unit tests
        run: python3 scripts/governance/test_pre_a10_area_gate.py -v

  pre-a10-completion-gate:
    name: Pre-A10 completion gate (must remain blocked until review complete)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reviewed immutable action commit for actions/checkout v7.0.1.
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require all review areas to be complete
        run: >-
          python3 scripts/governance/pre_a10_area_gate.py
          governance/candidates/CE_PRE_A10_AREA_REGISTER_R3_2026-10-10.json
          --require-complete
