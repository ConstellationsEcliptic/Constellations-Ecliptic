name: CE R0 Trusted Build A9

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "remediation/ce-r0-a9-trusted-build-r1/2026-10-08"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted_build:
    name: CE R0 Trusted Build A9 / immutable-container reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Identify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          echo "CANDIDATE_COMMIT=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_COMMIT=$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Pull exact content-addressed build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          docker pull "$IMAGE"
          REPO_DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          test "${REPO_DIGEST##*@}" = "sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a"
          docker run --rm --network none "$IMAGE" python -c 'import platform,sys; assert sys.version_info[:3] == (3,13,15); assert platform.machine() == "x86_64"; print(sys.version); print(platform.machine())'
          echo "CONTENT_ADDRESSED_IMAGE=$REPO_DIGEST"
          echo "LOCAL_IMAGE_ID=$IMAGE_ID"

      - name: Verify source-tree and control-plane identities
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_MANIFEST="$(cut -d' ' -f1 manifests/SOURCE_TREE_SHA256_V2.txt)"
          SOURCE_ACTUAL="$(PYTHONPATH=src python -B tools/compute_source_identity_v2.py)"
          CONTROL_MANIFEST="$(cut -d' ' -f1 provenance/CONTROL_PLANE_SHA256_R1.txt)"
          CONTROL_ACTUAL="$(PYTHONPATH=src python -B tools/compute_control_plane_identity_v1.py)"
          echo "SOURCE_TREE_MANIFEST=$SOURCE_MANIFEST"
          echo "SOURCE_TREE_ACTUAL=$SOURCE_ACTUAL"
          echo "CONTROL_PLANE_MANIFEST=$CONTROL_MANIFEST"
          echo "CONTROL_PLANE_ACTUAL=$CONTROL_ACTUAL"
          test "$SOURCE_ACTUAL" = "$SOURCE_MANIFEST"
          test "$CONTROL_ACTUAL" = "$CONTROL_MANIFEST"
          echo "SOURCE_TREE_IDENTITY_MATCH=TRUE"
          echo "CONTROL_PLANE_IDENTITY_MATCH=TRUE"

      - name: Verify trusted-build control inputs in immutable container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          docker run --rm --network none -v "$PWD:/work:ro" "$IMAGE" sh -eu -c '
            cd /work
            python build/verify_trusted_build_inputs.py
          '

      - name: Pre-fetch exact locked build artifacts
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          rm -rf "$RUNNER_TEMP/wheels"
          mkdir -p "$RUNNER_TEMP/wheels"
          docker run --rm -v "$RUNNER_TEMP/wheels:/wheels" "$IMAGE" sh -eu -c '
            python -m pip download --no-deps --only-binary=:all: --dest /wheels pip==26.2.1 setuptools==82.0.1
          '
          EXPECTED_PIP='71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e'
          EXPECTED_ST='a59e362652f08dcd477c78bb6e7bd9d80a7995bc73ce773050228a348ce2e5bb'
          ACTUAL_PIP="$(sha256sum "$RUNNER_TEMP/wheels/pip-26.2.1-py3-none-any.whl" | cut -d' ' -f1)"
          ACTUAL_ST="$(sha256sum "$RUNNER_TEMP/wheels/setuptools-82.0.1-py3-none-any.whl" | cut -d' ' -f1)"
          test "$ACTUAL_PIP" = "$EXPECTED_PIP"
          test "$ACTUAL_ST" = "$EXPECTED_ST"
          echo "PIP_SHA256=$ACTUAL_PIP"
          echo "SETUPTOOLS_SHA256=$ACTUAL_ST"

      - name: Materialize exact Git source twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ce-source-1" "$RUNNER_TEMP/ce-source-2"
          mkdir -p "$RUNNER_TEMP/ce-source-1" "$RUNNER_TEMP/ce-source-2"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/ce-source-1"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/ce-source-2"
          diff -qr "$RUNNER_TEMP/ce-source-1" "$RUNNER_TEMP/ce-source-2"
          echo "GIT_ARCHIVE_SOURCE_MATERIALIZATION_PARITY=PASS"

      - name: Build test and package twice in immutable container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          for n in 1 2; do
            rm -rf "$RUNNER_TEMP/build-$n" "$RUNNER_TEMP/wheel-$n" "$RUNNER_TEMP/pkgout-$n"
            mkdir -p "$RUNNER_TEMP/build-$n" "$RUNNER_TEMP/wheel-$n" "$RUNNER_TEMP/pkgout-$n"
            cp -a "$RUNNER_TEMP/ce-source-$n/." "$RUNNER_TEMP/build-$n/"
            docker run --rm --network none               -v "$RUNNER_TEMP/build-$n:/work"               -v "$RUNNER_TEMP/wheels:/wheels:ro"               -v "$RUNNER_TEMP/wheel-$n:/wheelout"               -v "$RUNNER_TEMP/pkgout-$n:/pkgout"               "$IMAGE" sh -eu -c '
                cd /work
                export PYTHONDONTWRITEBYTECODE=1
                export PYTHONPATH=/work:/work/src
                export SOURCE_DATE_EPOCH=0
                python build/check_build_inputs.py
                python -m venv /tmp/ce-venv
                export PATH=/tmp/ce-venv/bin:$PATH
                python -m pip install --force-reinstall --no-index --require-hashes --no-cache-dir --find-links /wheels -r build/trusted-build-dependency-lock.txt
                python -m pip --version
                python -c '"'"'import setuptools; assert setuptools.__version__ == "82.0.1"; print("SETUPTOOLS_VERSION=" + setuptools.__version__)'"'"'
                python tools/run_tests.py
                python tools/package_source.py
                cp /CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip /pkgout/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip
                python -m pip wheel . --no-deps --no-build-isolation --no-index --find-links /wheels --wheel-dir /wheelout
              '
            WHEEL_FILE="$(find "$RUNNER_TEMP/wheel-$n" -maxdepth 1 -name '*.whl' -type f | head -n1)"
            test -n "$WHEEL_FILE"
            test -f "$RUNNER_TEMP/pkgout-$n/../CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" 2>/dev/null || true
            if [ -f "$RUNNER_TEMP/build-$n/../CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" ]; then
              cp "$RUNNER_TEMP/build-$n/../CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" "$RUNNER_TEMP/pkgout-$n/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip"
            fi
            test -f "$RUNNER_TEMP/pkgout-$n/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip"
          done

          W1="$(sha256sum "$RUNNER_TEMP/wheel-1"/*.whl | cut -d' ' -f1)"
          W2="$(sha256sum "$RUNNER_TEMP/wheel-2"/*.whl | cut -d' ' -f1)"
          P1="$(sha256sum "$RUNNER_TEMP/pkgout-1/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" | cut -d' ' -f1)"
          P2="$(sha256sum "$RUNNER_TEMP/pkgout-2/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" | cut -d' ' -f1)"
          test "$W1" = "$W2"
          test "$P1" = "$P2"
          echo "WHEEL_REPRODUCIBLE=TRUE"
          echo "WHEEL_SHA256=$W1"
          echo "SOURCE_PACKAGE_REPRODUCIBLE=TRUE"
          echo "SOURCE_PACKAGE_SHA256=$P1"
          echo "$W1" > "$RUNNER_TEMP/wheel-sha256.txt"
          echo "$P1" > "$RUNNER_TEMP/source-package-sha256.txt"

      - name: Verify source-package boundary and determinism inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          p = Path(os.environ["RUNNER_TEMP"]) / "pkgout-1" / "CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip"
          with ZipFile(p) as z:
              names = z.namelist()
          assert all(not n.startswith("/") for n in names)
          assert all(".." not in n.split("/") for n in names)
          assert all(not n.startswith("provenance/") for n in names)
          assert all(not n.startswith("evidence/") for n in names)
          assert "build/trusted-build-environment.json" in names
          assert "build/trusted-build-lock.json" in names
          assert "build/trusted-build-dependency-lock.txt" in names
          print("SOURCE_PACKAGE_BOUNDARY_PASS")
          PY

      - name: Verify current candidate provenance is not stale
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("provenance/CE_V1_TRUSTED_BUILD_PROVENANCE_R3.json").read_text(encoding="utf-8"))
          actual = __import__("subprocess").check_output(["python","-B","build/build_source_tree_hash.py"], text=True).strip()
          if p.get("source_tree_sha256") != actual:
              print("STALE_TRUSTED_BUILD_PROVENANCE_DETECTED")
              print("PROVENANCE_SOURCE_TREE=" + str(p.get("source_tree_sha256")))
              print("ACTUAL_SOURCE_TREE=" + actual)
              raise SystemExit(2)
          raise SystemExit("A9 requires a new versioned current provenance record; R3 is not admissible.")
          PY

      - name: Final machine-readable output
        shell: bash
        run: |
          set -euo pipefail
          echo "--- CE_TB_A9_BEGIN ---"
          echo "CANDIDATE_COMMIT=$CANDIDATE_COMMIT"
          echo "SOURCE_TREE_SHA256=$(PYTHONPATH=src python -B tools/compute_source_identity_v2.py)"
          echo "CONTROL_PLANE_SHA256=$(PYTHONPATH=src python -B tools/compute_control_plane_identity_v1.py)"
          echo "TRUSTED_BUILD_DEPENDENCY_LOCK_SHA256=$(sha256sum build/trusted-build-dependency-lock.txt | cut -d' ' -f1)"
          echo "TRUSTED_BUILD_LOCK_SHA256=$(sha256sum build/trusted-build-lock.json | cut -d' ' -f1)"
          echo "ENVIRONMENT_RECORD_SHA256=$(sha256sum build/trusted-build-environment.json | cut -d' ' -f1)"
          echo "ENVIRONMENT_IMAGE=python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a"
          echo "FORMAL_TRUSTED_BUILD=NOT_ESTABLISHED"
          echo "PRODUCTION_RUNTIME=NOT_AUTHORIZED"
          echo "SEAL=NO"
          echo "AUTHORIZATION=NON_AUTHORIZED"
          echo "FAIL_CLOSED=TRUE"
          echo "--- CE_TB_A9_END ---"
