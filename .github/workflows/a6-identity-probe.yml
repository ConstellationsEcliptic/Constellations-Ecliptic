name: CE R0 A6 Identity Probe

on:
  push:
    branches:
      - "remediation/ce-r0-a6-temporal-contract-r1/2026-10-06"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compute A6 source identity
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          actual="$(python -B tools/compute_source_identity_v2.py)"
          echo "A6_IDENTITY_PROBE=$actual"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"body\":\"A6_IDENTITY_PROBE=$actual\ncommit=$GITHUB_SHA\"}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/23/comments"

# trigger diagnostic run
