name: CE V1 Trusted Build Hardening R3 Recheck (ephemeral)

on:
  push:
    branches:
      - audit/trusted-build-hardening-r3/2026-09-29-r1

permissions:
  contents: read

jobs:
  hardening-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Pull exact content-addressed build image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          docker pull "$IMAGE"
          REPO_DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          test "${REPO_DIGEST##*@}" = "sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a"
          docker run --rm --network none "$IMAGE" python -c 'import platform,sys; assert sys.version_info[:3]==(3,13,15); assert platform.machine()=="x86_64"; print(sys.version); print(platform.machine())'
          printf 'CONTENT_ADDRESSED_IMAGE=%s\n' "$REPO_DIGEST"
          printf 'LOCAL_IMAGE_ID=%s\n' "$IMAGE_ID"

      - name: Materialize exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA='be1187d6191fa34a4e75c380648b0f07c0fb85d5'
          git init audit-worktree
          cd audit-worktree
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "candidate/trusted-build-hardening/2026-09-29-r3"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          mkdir -p "$RUNNER_TEMP/ce-source"
          git archive "$CANDIDATE_SHA" | tar -x -C "$RUNNER_TEMP/ce-source"
          printf 'CANDIDATE_COMMIT=%s\n' "$CANDIDATE_SHA"

      - name: Verify source-tree identity and build-input contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ce-source"
          cp manifests/SOURCE_TREE_SHA256_V2.txt "$RUNNER_TEMP/manifest-before.txt"
          MANIFEST="$(cut -d' ' -f1 manifests/SOURCE_TREE_SHA256_V2.txt)"
          ACTUAL="$(python build/build_source_tree_hash.py)"
          printf 'COMPUTED_SOURCE_TREE_SHA256=%s\n' "$ACTUAL"
          printf 'MANIFEST_SOURCE_TREE_SHA256=%s\n' "$MANIFEST"
          if [ "$ACTUAL" != "$MANIFEST" ]; then
            printf 'SOURCE_TREE_MANIFEST_MATCH=FALSE\n'
          else
            printf 'SOURCE_TREE_MANIFEST_MATCH=TRUE\n'
          fi
          cmp "$RUNNER_TEMP/manifest-before.txt" manifests/SOURCE_TREE_SHA256_V2.txt
          printf 'HASHER_MANIFEST_MUTATION=FALSE\n'
          printf 'SOURCE_TREE_HASH_DISCOVERY=%s\n' "$ACTUAL"

      - name: Pre-fetch exact build artifacts and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          mkdir -p "$RUNNER_TEMP/wheels"
          docker run --rm -v "$RUNNER_TEMP/wheels:/wheels" "$IMAGE" sh -c 'python -m pip download --no-deps --only-binary=:all: --dest /wheels "pip==26.2.1" "setuptools==82.0.1"'
          EXPECTED_PIP='71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e'
          EXPECTED_ST='a59e362652f08dcd477c78bb6e7bd9d80a7995bc73ce773050228a348ce2e5bb'
          ACTUAL_PIP="$(sha256sum "$RUNNER_TEMP/wheels/pip-26.2.1-py3-none-any.whl" | cut -d' ' -f1)"
          ACTUAL_ST="$(sha256sum "$RUNNER_TEMP/wheels/setuptools-82.0.1-py3-none-any.whl" | cut -d' ' -f1)"
          test "$ACTUAL_PIP" = "$EXPECTED_PIP"
          test "$ACTUAL_ST" = "$EXPECTED_ST"
          printf 'PIP_SHA256=%s\n' "$ACTUAL_PIP"
          printf 'SETUPTOOLS_SHA256=%s\n' "$ACTUAL_ST"

      - name: Build and test inside exact immutable container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          for n in 1 2; do
            mkdir -p "$RUNNER_TEMP/work-$n" "$RUNNER_TEMP/wheel-$n" "$RUNNER_TEMP/pkgout-$n"
            cp -a "$RUNNER_TEMP/ce-source/." "$RUNNER_TEMP/work-$n/"
            docker run --rm --network none               -v "$RUNNER_TEMP/work-$n:/work"               -v "$RUNNER_TEMP/wheels:/wheels:ro"               -v "$RUNNER_TEMP/wheel-$n:/wheelout"               -v "$RUNNER_TEMP/pkgout-$n:/pkgout"               "$IMAGE" sh -eu -c '
                cd /work
                export PYTHONDONTWRITEBYTECODE=1
                export SOURCE_DATE_EPOCH=0
                python build/verify_trusted_build_inputs.py
                python build/check_build_inputs.py
                python -m venv /tmp/ce-venv
                /tmp/ce-venv/bin/python -m pip install --force-reinstall --no-index --require-hashes --no-cache-dir --find-links /wheels -r build/trusted-build-dependency-lock.txt
                /tmp/ce-venv/bin/python -m pip --version
                /tmp/ce-venv/bin/python -c "import setuptools; assert setuptools.__version__==\"82.0.1\"; print(\"SETUPTOOLS_VERSION=\"+setuptools.__version__)"
                /tmp/ce-venv/bin/python -m pip wheel . --no-deps --no-build-isolation --no-index --find-links /wheels --wheel-dir /wheelout
                /tmp/ce-venv/bin/python tools/run_tests.py
                /tmp/ce-venv/bin/python tools/package_source.py
                cp /CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip /pkgout/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip
              '
            echo "WHEEL_FILES_$n:"
            find "$RUNNER_TEMP/wheel-$n" -maxdepth 1 -type f -printf '%f\n' | sort
            echo "PACKAGE_FILES_$n:"
            find "$RUNNER_TEMP/pkgout-$n" -maxdepth 1 -type f -printf '%f\n' | sort
            WHEEL_COUNT="$(find "$RUNNER_TEMP/wheel-$n" -maxdepth 1 -name '*.whl' -type f | wc -l)"
            PACKAGE_COUNT="$(find "$RUNNER_TEMP/pkgout-$n" -maxdepth 1 -name 'CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip' -type f | wc -l)"
            echo "WHEEL_COUNT_$n=$WHEEL_COUNT"
            echo "PACKAGE_COUNT_$n=$PACKAGE_COUNT"
            test "$WHEEL_COUNT" -eq 1
            test "$PACKAGE_COUNT" -eq 1
          done

          W1="$(sha256sum "$RUNNER_TEMP/wheel-1"/*.whl | cut -d' ' -f1)"
          W2="$(sha256sum "$RUNNER_TEMP/wheel-2"/*.whl | cut -d' ' -f1)"
          P1="$(sha256sum "$RUNNER_TEMP/pkgout-1/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" | cut -d' ' -f1)"
          P2="$(sha256sum "$RUNNER_TEMP/pkgout-2/CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip" | cut -d' ' -f1)"
          test "$W1" = "$W2"
          test "$P1" = "$P2"
          printf '%s\n' "$W1" > "$RUNNER_TEMP/wheel-sha256.txt"
          printf '%s\n' "$P1" > "$RUNNER_TEMP/source-package-sha256.txt"
          printf 'WHEEL_REPRODUCIBLE=TRUE\n'
          printf 'WHEEL_SHA256=%s\n' "$W1"
          printf 'SOURCE_PACKAGE_REPRODUCIBLE=TRUE\n'
          printf 'SOURCE_PACKAGE_SHA256=%s\n' "$P1"

      - name: Verify reproducible source package boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from zipfile import ZipFile
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "pkgout-1" / "CE_V1_SOURCE_FOUNDATION_R1_FINAL.zip"
          with ZipFile(p) as z:
              names = z.namelist()
          assert all(not n.startswith("provenance/") for n in names)
          assert all(not n.startswith("evidence/") for n in names)
          assert any(n == "build/trusted-build-environment.json" for n in names)
          assert any(n == "build/trusted-build-lock.json" for n in names)
          print("SOURCE_PACKAGE_BOUNDARY_PASS")
          PY

      - name: Verify durable provenance record
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ce-source"
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("provenance/CE_V1_TRUSTED_BUILD_PROVENANCE_R3.json").read_text(encoding="utf-8"))
          assert p["status"] == "CANDIDATE_NON_AUTHORIZED"
          assert p["source_tree_sha256"] == "538fc61e19e14022f00d91bb4e280e09c45f03c9887b4d3411f3cfc7d5074645"
          assert p["build_environment"]["digest"] == "sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a"
          assert p["dependency_artifacts"]["pip_26_2_1_sha256"] == "71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e"
          assert p["dependency_artifacts"]["setuptools_82_0_1_sha256"] == "a59e362652f08dcd477c78bb6e7bd9d80a7995bc73ce773050228a348ce2e5bb"
          assert p["build_control_records"]["trusted_build_lock_sha256"] == "6f9ef3a29b69a8aa81a34b2cec7d85b6cf04b915bc8c535f8eee9e6fc6799b7c"
          assert p["build_control_records"]["environment_record_sha256"] == "5321acb42c949a5b82f679a7c26dfa84f3435103ecda0bcbbd063f262fa1da75"
          assert p["build_policy"]["dependency_installation"] == "FORCE_REINSTALL_FROM_PRE_FETCHED_HASHED_ARTIFACTS"
          assert p["build_policy"]["network_during_build"] is False
          assert p["build_policy"]["source_date_epoch"] == 0
          actual_wheel = Path(os.environ["RUNNER_TEMP"] + "/wheel-sha256.txt").read_text().strip()
          actual_pkg = Path(os.environ["RUNNER_TEMP"] + "/source-package-sha256.txt").read_text().strip()
          assert p["verification"]["wheel_sha256"] == actual_wheel
          assert p["verification"]["source_package_sha256"] == actual_pkg
          print("DURABLE_PROVENANCE_PASS")
          PY

      - name: Final provenance output
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='python:3.13.15-slim-bookworm@sha256:3e2de9c40ca4e3d73240059f9d48baff27908f10293e985a2f382a0378e6df4a'
          cd "$RUNNER_TEMP/ce-source"
          printf '%s\n' '--- CE_TB_R3_RECHECK_BEGIN ---'
          printf 'CANDIDATE_COMMIT=be1187d6191fa34a4e75c380648b0f07c0fb85d5\n'
          printf 'SOURCE_TREE_SHA256='; python build/build_source_tree_hash.py
          printf 'ENVIRONMENT_IMAGE=%s\n' "$IMAGE"
          printf 'PYTHON_VERSION_IN_CONTAINER='; docker run --rm --network none "$IMAGE" python --version
          printf 'ARCHITECTURE_IN_CONTAINER='; docker run --rm --network none "$IMAGE" python -c 'import platform; print(platform.machine())'
          printf 'NETWORK_DURING_BUILD=FALSE\n'
          printf 'SOURCE_PACKAGE_EXCLUDES=evidence/,provenance/\n'
          printf 'FORMAL_TRUSTED_BUILD=NOT_ESTABLISHED\n'
          printf 'PRODUCTION_RUNTIME=NOT_AUTHORIZED\n'
          printf 'SEAL=NO\n'
          printf 'AUTHORIZATION=NON_AUTHORIZED\n'
          printf 'FAIL_CLOSED=TRUE\n'
          printf '%s\n' '--- CE_TB_R3_RECHECK_END ---'
