name: CE Rev4 Oracle Qualification

on:
  push:
    branches:
      - "development/rev4-oracle-qualification-r1/**"
  pull_request:
    branches:
      - "development/convergent-a1-b1/**"

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Python version
        run: python --version
      - name: Compile source, tests and qualification tooling
        run: python -m compileall -q src tests tools
      - name: Validate oracle qualification binding
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/validate_oracle_qualification.py
      - name: Run full unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
