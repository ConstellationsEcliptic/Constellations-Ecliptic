name: CE ephemeral source-tree hash audit

on:
  push:
    branches:
      - "audit/source-tree-hash-pr5-2026-09-28"

jobs:
  source-tree-hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR5 candidate
        uses: actions/checkout@v4
        with:
          ref: 3db976fd7293f0d4c5d367a81fc87489a97ba900
          fetch-depth: 0

      - name: Remove ephemeral workflow from audited worktree
        shell: bash
        run: rm -f .github/workflows/ce-ephemeral-source-tree-hash-audit.yml

      - name: Verify CE source identity
        shell: bash
        run: python tools/verify_source_identity.py

      - name: Compute CE source-tree SHA-256
        shell: bash
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path("build/build_source_tree_hash.py")
          digest = ns["digest"]()
          print(f"CURRENT_TARGET_SOURCE_TREE_SHA256={digest}")
          with open("ce-source-tree-hash.txt", "w", encoding="utf-8") as f:
              f.write(digest + "\n")
          PY

      - name: Publish hash to job summary
        shell: bash
        run: |
          echo "Target commit: 3db976fd7293f0d4c5d367a81fc87489a97ba900" >> "$GITHUB_STEP_SUMMARY"
          echo "Source-tree SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^[0-9a-f]{64}$' ce-source-tree-hash.txt >> "$GITHUB_STEP_SUMMARY"
