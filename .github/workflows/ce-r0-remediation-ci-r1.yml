name: CE R0 Remediation CI

on:
  push:
    branches:
      - "remediation/ce-r0-root-hardening-r1/2026-10-06"
      - "remediation/ce-r0-a1-issuance-boundary-r1/2026-10-06"
      - "remediation/ce-r0-ci-hard-gates-r1/2026-10-06"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        shell: bash
        run: python -m compileall -q src tests tools
      - name: Source identity
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -e
          actual="$(python -B tools/compute_source_identity_v2.py 2>&1)"
          rc=$?
          manifest="$(awk '{print $1}' manifests/SOURCE_TREE_SHA256_V2.txt)"
          echo "SOURCE_TREE_COMPUTE_EXIT=$rc"
          echo "SOURCE_TREE_ACTUAL=$actual"
          echo "SOURCE_TREE_MANIFEST=$manifest"
          if [ "$rc" -eq 0 ] && [ "$actual" = "$manifest" ]; then
            echo "SOURCE_TREE_IDENTITY_MATCH=TRUE"
          else
            echo "SOURCE_TREE_IDENTITY_MATCH=FALSE"
            exit 1
          fi
      - name: Full unit suite
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
