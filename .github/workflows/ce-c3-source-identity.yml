name: CE C3 candidate source identity recomputation

on:
  push:
    branches:
      - verification/c3-source-identity-2026-09-26

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CE reconciled candidate commit
        uses: actions/checkout@v4
        with:
          ref: c9ef69bddd59a58f3611fea44b67843d22df2cd4
          fetch-depth: 1

      - name: Recompute CE source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"
          python3 build/build_source_tree_hash.py
          echo "SOURCE_TREE_FILE=$(cat manifests/SOURCE_TREE_SHA256.txt 2>/dev/null || cat manifests/SOURCE_TREE_SHA256_V2.txt)"
          echo "DEPENDENCY_LOCK_SHA256=$(sha256sum build/dependency-lock.txt | awk '{print $1}')"
          echo "BUILD_DEFINITION_SHA256=$(sha256sum build/build-definition.json | awk '{print $1}')"

      - name: Run full candidate test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/run_tests.py
