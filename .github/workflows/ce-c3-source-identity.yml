name: CE C3 candidate source identity recomputation

on:
  push:
    branches:
      - verification/c3-source-identity-2026-09-26

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CE reconciled candidate commit
        uses: actions/checkout@v4
        with:
          ref: 804036f843a56d0029ceea08af35247d28cbde7e
          fetch-depth: 1

      - name: Recompute and compare source identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_COMMIT=$checked_out"
          actual="$(python3 build/build_source_tree_hash.py)"
          declared="$(awk 'NF{print $1; exit}' manifests/SOURCE_TREE_SHA256_V2.txt)"
          echo "ACTUAL_SOURCE_TREE_SHA256_V2=$actual"
          echo "DECLARED_SOURCE_TREE_SHA256_V2=$declared"
          test "$actual" = "$declared"

          echo "DEPENDENCY_LOCK_SHA256=$(sha256sum build/dependency-lock.txt | awk '{print $1}')"
          echo "BUILD_DEFINITION_SHA256=$(sha256sum build/build-definition.json | awk '{print $1}')"

      - name: Run full candidate test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/run_tests.py
